workdir: /tmp

models:
  mon_site:
    schedule:
      cron: "* * * * *"
    databases:
      ma_db_mysql:
        type: mysql
        host: localhost
        port: 3306
        database: myapp_prod
        username: root
        password: s3cr3t
    archive:
      includes:
        - ~/Documents/myapp
      excludes:
        - ~/Documents/myapp/cache
        - ~/Documents/myapp/tmp
    compress_with:
      type: tgz
    notifiers:
      discord:
        type: discord
        url: $DISCORD_WEBHOOK_URL
        on_success: true
        on_failure: true
      slack:
        type: slack
        url: $SLACK_WEBHOOK_URL
        on_success: true
        on_failure: true
      mail:
        type: mail
        host: smtp.example.com
        port: 587
        encryption: start_tls
        username: $SMTP_USERNAME
        password: $SMTP_PASSWORD
        from: backup@example.com
        to:
          - admin@example.com
        on_success: true
        on_failure: true
    storages:
      local:
        type: local
        path: ~/backups/pack
        keep: 3
      ftp:
        type: ftp
        host: ftp.example.com
        port: 21
        timeout: 300
        path: /backups
        username: pack
        password: secret
        explicit_tls: false
        no_check_certificate: false
        keep: 3
      sftp:
        type: sftp
        host: sftp.example.com
        port: 22
        timeout: 300
        path: /backups
        username: pack
        password: secret
        keep: 3
        # Alternative authentication method:
        # private_key: ~/.ssh/id_rsa
        # passphrase: secret-passphrase
