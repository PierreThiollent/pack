workdir: /tmp

models:
  mon_site:
    databases:
      ma_db_mysql:
        type: mysql
        host: localhost
        port: 3306
        database: myapp_prod
        username: root
        password: s3cr3t
    archive:
      includes:
        - ~/Documents/myapp
      excludes:
        - ~/Documents/myapp/cache
        - ~/Documents/myapp/tmp
    compress_with:
      type: tgz
    storages:
      local:
        type: local
        path: ~/backups/pack
