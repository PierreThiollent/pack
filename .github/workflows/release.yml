name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify source release version
        run: scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

  changelog:
    name: Generate release changelog
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Cocogitto
        uses: cocogitto/cocogitto-action@v3
        with:
          check: false

      - name: Generate release changelog
        run: cog changelog --at ${{ github.ref_name }} > RELEASE_CHANGELOG.md

      - name: Upload release changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: RELEASE_CHANGELOG.md

  release:
    name: Release (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    needs: changelog
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected_arch: x86_64
            asset_name: pack-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            expected_arch: aarch64
            asset_name: pack-linux-arm64.tar.gz
          - os: macos-15-intel
            expected_arch: x86_64
            asset_name: pack-darwin-amd64.tar.gz
          - os: macos-14
            expected_arch: arm64
            asset_name: pack-darwin-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify runner architecture
        run: |
          actual_arch="$(uname -m)"
          if [ "${actual_arch}" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected ${{ matrix.expected_arch }}, got ${actual_arch}" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify release binary
        run: target/release/pack --version

      - name: Package release asset
        run: tar -czf "${{ matrix.asset_name }}" -C target/release pack

      - name: Download release changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: release-changelog

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_CHANGELOG.md
          files: ${{ matrix.asset_name }}

  docker-publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/pierrethiollent/pack

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable release tag
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          image_reference="${IMAGE_NAME}:${release_version}"
          if docker buildx imagetools inspect "${image_reference}" >/dev/null 2>&1; then
            echo "Immutable image tag already exists: ${image_reference}" >&2
            exit 1
          fi

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          target: runtime-from-release
          build-args: PACK_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release
          provenance: mode=max
          sbom: true

      - name: Run Docker smoke test
        env:
          PACK_DOCKER_SKIP_BUILD: "1"
        run: scripts/docker-smoke-test.sh "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Verify image release version
        run: scripts/verify-release-version.sh "${GITHUB_REF_NAME}" "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Publish immutable Docker tags
        run: |
          image_source="${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          tag_arguments=""

          while IFS= read -r image_tag; do
            if [ -n "${image_tag}" ]; then
              tag_arguments="${tag_arguments} --tag ${image_tag}"
            fi
          done <<'EOF'
          ${{ steps.metadata.outputs.tags }}
          EOF

          # shellcheck disable=SC2086 # tag_arguments is intentionally split into Docker CLI arguments.
          docker buildx imagetools create ${tag_arguments} "${image_source}"

      - name: Verify multi-architecture manifest
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          image_reference="${IMAGE_NAME}:${release_version}"
          manifest="$(docker buildx imagetools inspect "${image_reference}")"
          printf '%s\n' "${manifest}"
          printf '%s\n' "${manifest}" | grep -q 'linux/amd64'
          printf '%s\n' "${manifest}" | grep -q 'linux/arm64'
          echo "Published ${image_reference} with digest ${{ steps.build.outputs.digest }}"
