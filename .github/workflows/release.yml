name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    name: Generate release changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Cocogitto
        uses: cocogitto/cocogitto-action@v3
        with:
          check: false

      - name: Generate release changelog
        run: cog changelog --at ${{ github.ref_name }} > RELEASE_CHANGELOG.md

      - name: Upload release changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: RELEASE_CHANGELOG.md

  release:
    name: Release (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    needs: changelog

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected_arch: x86_64
            asset_name: pack-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            expected_arch: aarch64
            asset_name: pack-linux-arm64.tar.gz
          - os: macos-15-intel
            expected_arch: x86_64
            asset_name: pack-darwin-amd64.tar.gz
          - os: macos-14
            expected_arch: arm64
            asset_name: pack-darwin-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify runner architecture
        run: |
          actual_arch="$(uname -m)"
          if [ "${actual_arch}" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected ${{ matrix.expected_arch }}, got ${actual_arch}" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify release binary
        run: target/release/pack --version

      - name: Package release asset
        run: tar -czf "${{ matrix.asset_name }}" -C target/release pack

      - name: Download release changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: release-changelog

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_CHANGELOG.md
          files: ${{ matrix.asset_name }}
